
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Magical Birthday Celebration</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;800&display=swap');

:root{--gold:#ffdc91;--pink:#ff62d0;--purple:#a879ff}
*{box-sizing:border-box}
body{
 margin:0;height:100dvh;overflow:hidden;color:white;
 font-family:Poppins,Arial,sans-serif;
 background:#080313;
}
.scene{
 position:fixed;inset:0;height:100dvh;width:100%;
 display:none;align-items:center;justify-content:center;
 text-align:center;overflow:hidden;padding:25px 18px;
 background:radial-gradient(ellipse at 50% 35%,#59235e 0%,#20103e 48%,#05030d 100%);
}
.scene.active{display:flex;animation:enter .65s ease both}
@keyframes enter{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:scale(1)}}
.content{position:relative;z-index:3;width:100%;max-width:650px;max-height:90dvh}
h1{
 font-size:clamp(35px,9vw,76px);line-height:1.1;
 color:var(--gold);text-shadow:0 0 18px #ff9d36,0 0 38px #ff42c4;
 margin:14px 0;
}
h2{color:var(--gold);font-size:clamp(23px,5vw,36px)}
.name{
 font-family:'Great Vibes',Georgia,serif;
 font-size:clamp(70px,17vw,125px);color:#ff79de;
 text-shadow:0 0 12px #ff20bc,0 0 38px #ff20bc;
 animation:glow 2s infinite alternate;
}
@keyframes glow{to{filter:brightness(1.7)}}
.sub{font-size:clamp(13px,3vw,18px);line-height:1.8;color:#ffe5f8}
button{
 font-family:inherit;font-weight:700;font-size:14px;
 padding:13px 20px;margin:6px;color:#2b0b32;
 background:linear-gradient(115deg,#ffdc91,#ff65d0);
 border:1px solid #ffe9b7;border-radius:40px;
 cursor:pointer;box-shadow:0 0 18px #ff59d555;
 transition:transform .2s;
}
button:active{transform:scale(.94)}
button:disabled{opacity:.35;cursor:not-allowed}
.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}
.top{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;align-items:center;
 z-index:10;font-size:11px;color:#ffe4bd;
}
.top button{font-size:12px;padding:9px 13px;margin:0}
.big{
 font-size:clamp(85px,20vw,145px);cursor:pointer;
 filter:drop-shadow(0 0 20px #ff6cce);
 animation:bob 1.8s ease-in-out infinite alternate;
}
@keyframes bob{to{transform:translateY(-12px) rotate(3deg)}}
.playarea{
 height:min(35dvh,290px);display:flex;align-items:center;
 justify-content:center;flex-wrap:wrap;gap:10px;overflow:hidden;
}
.item{font-size:clamp(38px,9vw,65px);cursor:pointer;animation:bob 1.7s infinite alternate}
.status{min-height:38px;color:var(--gold);font-size:14px;line-height:1.6}
#stars{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.star{position:absolute;color:#ffe5ad;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.12;transform:scale(.5)}}
.effect{position:fixed;z-index:20;pointer-events:none;animation:explode 1.1s ease-out forwards}
@keyframes explode{to{transform:translate(var(--x),var(--y)) rotate(400deg) scale(.1);opacity:0}}
.fall{position:fixed;top:-50px;z-index:15;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115dvh) rotate(720deg);opacity:.1}}
.glass{
 border:1px solid #e8c17c;border-radius:25px;padding:20px;
 background:#180b2bc9;box-shadow:0 0 35px #ff45c52a;
}
.small{font-size:11px;color:#d9c0ed}
</style>
</head>

<body>
<div id="stars"></div>

<!-- OPENING: ONLY TWO OPTIONS -->
<section class="scene active" id="home">
 <div class="content">
  <div class="big">🌙✨🪄</div>
  <p class="sub">A magical world of love, surprises and happiness</p>
  <h1>THE BIRTHDAY EXPERIENCE</h1>
  <p class="sub">Choose how the magic begins...</p>
  <div class="buttons">
   <button onclick="start(false)">🎂 HAPPY BIRTHDAY</button>
   <button onclick="start(true)">🪄 MAGIC MODE</button>
  </div>
  <p class="small">FULL-SCREEN CELEBRATION · 8 MAGICAL CHAPTERS</p>
 </div>
</section>

<!-- ALL OTHER SCREENS ARE GENERATED BY JAVASCRIPT -->
<div id="app"></div>

<script>
const $=id=>document.getElementById(id);

let magic=false,step=0,popped=0,opened=false,candles=5;
let audio=null,musicTimer=null,musicOn=false;
let fireworksTimer=null;

const chapters=[
 {title:'A MAGICAL BEGINNING',emoji:'🌙✨',desc:'A little magic is waiting for you...'},
 {title:'THE GRAND REVEAL',emoji:'👑',desc:'Today, the universe celebrates someone special.'},
 {title:'POP THE BALLOONS',emoji:'🎈',desc:'Tap every balloon and release the magic!'},
 {title:'MYSTERY GIFT BOXES',emoji:'🎁',desc:'Choose a gift to discover your surprise.'},
 {title:'MAKE A WISH',emoji:'🎂',desc:'Blow out all five candles and make a wish.'},
 {title:'MAGIC SHOW',emoji:'🪄',desc:'Tap the wand to fill the sky with magic.'},
 {title:'A LETTER FROM THE HEART',emoji:'💌',desc:'Some wishes deserve a special place.'},
 {title:'THE GRAND FINALE',emoji:'🎆',desc:'One final celebration full of love and light.'}
];

function start(mode){
 magic=mode;step=0;popped=0;opened=false;candles=5;
 stopMusic();render();
 if(magic)rain(['🪄','🦋','✨','💖','🌟'],65);
}
function render(){
 $('app').innerHTML='';
 const c=chapters[step];
 const scene=document.createElement('section');
 scene.className='scene active';
 scene.innerHTML=`
  <div class="top">
   <button onclick="back()">← Back</button>
   <span>${step+1} / ${chapters.length} ${magic?' · ✨ MAGIC MODE':''}</span>
   <button onclick="toggleMusic()">🎵 ${musicOn?'Pause':'Music'}</button>
  </div>
  <div class="content">
   <div style="font-size:clamp(45px,10vw,75px)">${c.emoji}</div>
   <h1 style="font-size:clamp(27px,7vw,50px)">${c.title}</h1>
   <p class="sub">${c.desc}</p>
   <div class="playarea" id="playarea"></div>
   <div class="status" id="status"></div>
   <div class="buttons" id="actions"></div>
  </div>`;
 $('app').appendChild(scene);
 buildChapter();
 if(magic)rain(['✨','💖','🦋','🌟'],18);
}
function action(label,fn,disabled=false){
 const b=document.createElement('button');
 b.textContent=label;b.disabled=disabled;b.onclick=fn;
 $('actions').appendChild(b);return b;
}
function say(text){$('status').textContent=text}
function next(label='NEXT CHAPTER →'){
 action(label,()=>{if(step<chapters.length-1){step++;render()}else{start(false)}});
}
function back(){
 if(step===0){$('app').innerHTML='';returnToHome()}
 else{step--;render()}
}
function returnToHome(){
 stopMusic();
 document.querySelectorAll('.scene').forEach(e=>e.remove());
 $('home').classList.add('active');
}
function buildChapter(){
 const area=$('playarea');
 if(step===0){
  area.innerHTML='<div class="big">🌌💫🌌</div>';
  say('Your magical journey begins now.');
  next('REVEAL THE SURPRISE →');
 }
 if(step===1){
  area.innerHTML='<div><div class="name">Amina</div><div style="font-size:25px">🎂💖👑</div></div>';
  say('Happy Birthday, Amina! May your life shine forever. ❤️');
  action('🎉 LET’S CELEBRATE',()=>{fireworks();rain(['🎉','💖','✨'],60);});
  next('POP THE BALLOONS →');
 }
 if(step===2)buildBalloons(area);
 if(step===3)buildGifts(area);
 if(step===4)buildCake(area);
 if(step===5){
  area.innerHTML='<div class="big" onclick="magicShow()">🪄</div>';
  say('Tap the wand or use the magic button.');
  action('✨ CAST A SPELL',magicShow);
  action('🎆 FIREWORKS',fireworks);
  action('🦋 BUTTERFLY MAGIC',()=>rain(['🦋','✨','💖'],70));
  next('OPEN YOUR LETTER →');
 }
 if(step===6){
  area.innerHTML=`<div class="glass"><div style="font-size:45px">💌</div>
  <p class="sub">Dear Amina,</p>
  <p class="sub">May your life be filled with endless happiness, beautiful memories, success and love. May every dream in your heart come true. May Allah bless you with health, peace and a wonderful future. Ameen! 🤲</p>
  <div style="font-size:30px">🌹💖🌹</div></div>`;
  say('You deserve every beautiful thing in this world.');
  action('💖 SEND LOVE',()=>rain(['💖','💕','🌹'],65));
  next('GRAND FINALE →');
 }
 if(step===7){
  area.innerHTML='<div class="name">Amina</div><div class="big">🎆🎂🎆</div>';
  say('Happy Birthday! May all your beautiful wishes come true. ❤️');
  action('🎆 GRAND FIREWORKS',fireworks);
  action('🎊 CONFETTI STORM',()=>rain(['🎊','🎉','✨','💖','🌹'],100));
  action('🎵 PLAY BIRTHDAY TUNE',toggleMusic);
  action('↻ START AGAIN',()=>start(magic));
  fireworks();
 }
}
function buildBalloons(area){
 popped=0;
 const colors=['🎈','🎈','🎈','🎈','🎈','🎈','🎈','🎈','🎈','🎈'];
 colors.forEach((v,i)=>{
  let e=document.createElement('span');e.className='item';e.textContent=v;
  e.onclick=()=>{
   if(e.dataset.done)return;e.dataset.done='1';popped++;
   e.textContent='✨';burst(e.getBoundingClientRect().left+20,e.getBoundingClientRect().top+20);
   say(popped+' / '+colors.length+' balloons popped!');
   if(popped===colors.length){
    say('All balloons popped! You unlocked the magic! 🎉');
    $('continueBalloons').disabled=false;
   }
  };area.appendChild(e);
 });
 action('CONTINUE →',()=>{step++;render()},true).id='continueBalloons';
}
function buildGifts(area){
 const messages=[
  '💖 A gift of happiness: May every day bring you a reason to smile!',
  '🌹 A gift of love: May you always be surrounded by people who care!',
  '👑 A gift of success: May every dream become reality!'
 ];
 messages.forEach((m,i)=>{
  let e=document.createElement('span');e.className='item';e.textContent=['🎁','🎀','💝'][i];
  e.onclick=()=>{
   if(e.dataset.opened)return;e.dataset.opened='1';opened=true;
   e.textContent='✨';say(m);burst(e.getBoundingClientRect().left+20,e.getBoundingClientRect().top+20);
   if(opened)$('giftContinue').disabled=false;
  };area.appendChild(e);
 });
 action('NEXT →',()=>{step++;render()},true).id='giftContinue';
}
function buildCake(area){
 area.innerHTML='<div id="cake" class="big">🎂</div>';
 const row=document.createElement('div');row.className='buttons';
 for(let i=0;i<5;i++){
  const b=document.createElement('button');b.textContent='🕯️';
  b.onclick=()=>{
   if(b.dataset.off)return;b.dataset.off='1';b.textContent='💨';candles--;
   say(candles+' candles remaining.');
   if(candles===0){
    $('cake').textContent='🎂💖';say('All candles are out! Make a wish, Amina! 🌟');
    fireworks();$('cakeContinue').disabled=false;
   }
  };row.appendChild(b);
 }
 area.appendChild(row);
 action('CONTINUE →',()=>{step++;render()},true).id='cakeContinue';
}
function magicShow(){
 say('Abracadabra! Your birthday sky is full of magic! 🪄');
 fireworks();rain(['✨','🦋','💖','🌟','🪄'],65);
}
function burst(x,y){
 for(let i=0;i<24;i++){
  let p=document.createElement('span');p.className='effect';
  p.textContent=['✨','💖','🎉','⭐','🦋'][i%5];
  p.style.left=x+'px';p.style.top=y+'px';
  let a=2*Math.PI*i/24,r=40+Math.random()*110;
  p.style.setProperty('--x',Math.cos(a)*r+'px');
  p.style.setProperty('--y',Math.sin(a)*r+'px');
  document.body.appendChild(p);setTimeout(()=>p.remove(),1300);
 }
}
function rain(chars,count=55){
 for(let i=0;i<count;i++){
  let p=document.createElement('span');p.className='fall';
  p.textContent=chars[Math.floor(Math.random()*chars.length)];
  p.style.left=Math.random()*100+'vw';
  p.style.fontSize=(18+Math.random()*27)+'px';
  p.style.animationDuration=(3+Math.random()*5)+'s';
  document.body.appendChild(p);setTimeout(()=>p.remove(),8500);
 }
}
function fireworks(){
 for(let k=0;k<9;k++){
  setTimeout(()=>{
   burst(Math.random()*innerWidth,Math.random()*innerHeight*.7);
  },k*200);
 }
}
function toggleMusic(){
 if(musicOn){stopMusic();say('Birthday music paused.');return}
 playMusic();
}
function playMusic(){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  audio.resume();stopMusic();musicOn=true;
  const notes=[
   [392,.35],[392,.35],[440,.7],[392,.7],[523,.7],[494,1.2],
   [392,.35],[392,.35],[440,.7],[392,.7],[587,.7],[523,1.2],
   [392,.35],[392,.35],[784,.7],[659,.7],[523,.7],[494,.7],[440,1.2],
   [698,.35],[698,.35],[659,.7],[523,.7],[587,.7],[523,1.2]
  ];
  let i=0;
  function note(){
   if(!musicOn)return;
   const [freq,duration]=notes[i%notes.length];i++;
   const o=audio.createOscillator(),g=audio.createGain();
   o.type='sine';o.frequency.value=freq;
   g.gain.setValueAtTime(.001,audio.currentTime);
   g.gain.exponentialRampToValueAtTime(.13,audio.currentTime+.04);
   g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration*.85);
   o.connect(g);g.connect(audio.destination);
   o.start();o.stop(audio.currentTime+duration);
   musicTimer=setTimeout(note,duration*1000);
  }
  note();say('Birthday melody is playing! 🎵');
 }catch(e){say('Please use a browser that supports audio.')}
}
function stopMusic(){
 musicOn=false;clearTimeout(musicTimer);musicTimer=null;
}
for(let i=0;i<100;i++){
 let s=document.createElement('span');s.className='star';s.textContent='✦';
 s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
 s.style.fontSize=(7+Math.random()*14)+'px';
 s.style.animationDelay=Math.random()*3+'s';
 $('stars').appendChild(s);
}
</script>
</body>
</html>
